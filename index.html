<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>
    AI Portfolio Builder
  </title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      padding: 30px;
    }

    .container {
      max-width: 1400px;
      margin: auto;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 32px;
    }

    h2 {
      margin-bottom: 16px;
      color: #06b6d4;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #06b6d4;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    iframe {
      width: 100%;
      height: 800px;
      border: none;
      border-radius: 12px;
      background: white;
    }

    pre {
      white-space: pre-wrap;
      overflow: auto;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      max-height: 700px;
    }

    .download-btn {
      margin-top: 15px;
      background: #22c55e;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media(max-width:900px) {

      .grid {
        grid-template-columns: 1fr;
      }

    }
  </style>

</head>

<body>

  <div class="container">

    <div class="card">

      <h1>
        AI Portfolio Builder
      </h1>

      <label>
        Upload CV PDF
      </label>

      <input type="file" id="cvFile" accept=".pdf" />

      <label>
        Upload Existing Portfolio HTML (Optional)
      </label>

      <input type="file" id="portfolioFile" accept=".html" />

      <button onclick="generatePortfolio()">

        Generate Portfolio

      </button>

    </div>

    <div class="grid">

      <div class="card">

        <h2>
          AI Instructions
        </h2>

        <pre id="instructionsBox">

Waiting...

        </pre>

      </div>

      <div class="card">

        <h2>
          Generated HTML
        </h2>

        <pre id="htmlBox">

Waiting...

        </pre>

      </div>

    </div>

    <div class="card">

      <h2>
        Portfolio Preview
      </h2>

      <iframe id="previewFrame"></iframe>

      <button class="download-btn" onclick="downloadHTML()">

        Download Portfolio

      </button>

    </div>

  </div>

  <script>

    let generatedHTML = "";

    async function fileToBase64(file) {

      return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.readAsDataURL(file);

        reader.onload = () => {

          const base64 =
            reader.result.split(",")[1];

          resolve(base64);

        };

        reader.onerror =
          error => reject(error);

      });

    }

    async function generatePortfolio() {

      const cvFile =
        document.getElementById("cvFile")
          .files[0];

      const portfolioFile =
        document.getElementById("portfolioFile")
          .files[0];

      const instructionsBox =
        document.getElementById("instructionsBox");

      const htmlBox =
        document.getElementById("htmlBox");

      const previewFrame =
        document.getElementById("previewFrame");

      if (!cvFile) {

        alert("Upload CV first");

        return;

      }

      instructionsBox.textContent =
        "Analyzing CV...";

      htmlBox.textContent =
        "Generating portfolio...";

      try {

        const cvBase64 =
          await fileToBase64(cvFile);

        let htmlTemplate = "";

        /*
          User uploaded custom portfolio
        */

        if (portfolioFile) {

          htmlTemplate =
            await portfolioFile.text();

        }

        /*
          Use default template
        */

        else {

          const response =
            await fetch("templete2_prof.html");

          htmlTemplate =
            await response.text();

        }

        const prompt = `

You are a senior frontend developer
and AI portfolio builder.

You will receive:

1- CV PDF
2- HTML portfolio template

The user may:
- upload custom portfolio
OR
- use default template

YOUR TASK:

KEEP:
- same design
- same CSS
- same layout
- same animations
- same structure

ONLY replace content.

Replace:
- Name
- About
- Skills
- Projects
- Experience
- Contact
- Social links
- Certifications

PROJECTS:

Generate projects dynamically
based on CV projects.

IMPORTANT:

1- Do NOT redesign layout.

2- Do NOT remove CSS.

3- Do NOT remove animations.

4- Keep classes unchanged.

5- If profile image missing:

Use:

assets/images/profile.png

Add HTML comment:

PLACE PROFILE IMAGE HERE

6- If project image missing:

Use:

assets/images/projects/project-name.png

Add HTML comments.

7- Generate separate instructions.

8- Return EXACTLY in this format:

===INSTRUCTIONS===

instructions here

===HTML===

full html here

HERE IS THE HTML TEMPLATE:

${htmlTemplate}

        `;
        const response = await fetch(

          "https://api-create-potfolio.vercel.app/api/generate",

          {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              cvBase64,
              htmlTemplate

            })

          }

        );

        const data =
          await response.json();

        console.log(data);

        if (
          data.candidates &&
          data.candidates.length > 0
        ) {

          let fullResponse =
            data.candidates[0]
              .content
              .parts[0]
              .text;

          /*
            remove markdown
          */

          fullResponse =
            fullResponse
              .replace(/```html/g, "")
              .replace(/```/g, "");

          /*
            split sections
          */

          const instructionsPart =
            fullResponse.split(
              "===HTML==="
            )[0];

          const htmlPart =
            fullResponse.split(
              "===HTML==="
            )[1];

          const cleanInstructions =
            instructionsPart.replace(
              "===INSTRUCTIONS===",
              ""
            );

          instructionsBox.textContent =
            cleanInstructions;

          htmlBox.textContent =
            htmlPart;

          generatedHTML =
            htmlPart;

          previewFrame.srcdoc =
            htmlPart;

        }

        else {

          htmlBox.textContent =
            JSON.stringify(
              data,
              null,
              2
            );

        }

      }

      catch (error) {

        console.error(error);

        htmlBox.textContent =
          "Error happened";

      }

    }

    function downloadHTML() {

      if (!generatedHTML) {

        alert(
          "Generate portfolio first"
        );

        return;

      }

      const blob =
        new Blob(

          [generatedHTML],

          {
            type: "text/html"
          }

        );

      const url =
        URL.createObjectURL(blob);

      const a =
        document.createElement("a");

      a.href = url;

      a.download =
        "portfolio.html";

      a.click();

      URL.revokeObjectURL(url);

    }

  </script>

</body>

</html>
